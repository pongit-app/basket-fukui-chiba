const GOKEY='going';
let GOING;
try{ const raw=localStorage.getItem(GOKEY); GOING=new Set(raw?JSON.parse(raw):null); }catch(e){ GOING=new Set(); }
function saveGoing(){ try{ localStorage.setItem(GOKEY, JSON.stringify([...GOING])); }catch(e){} }
function gkey(g){ return cur+'|'+g.d+'|'+g.opp; }

const TODAY = new Date(); TODAY.setHours(0,0,0,0);
let cur = "千葉ジェッツ", filt = "all";
const keys = Object.keys(DATA);
const tabsEl = document.getElementById('tabs');

function mkTabs(){
  tabsEl.innerHTML = '';
  [...keys,"日本代表"].forEach(k=>{
    const b=document.createElement('span');
    b.className='tab'+(k===cur?' on':'');
    b.textContent = k==="日本代表" ? "🇯🇵 日本代表" : DATA[k].short;
    b.style.setProperty('--tc', k==="日本代表" ? "#c8102e" : DATA[k].color);
    b.onclick=()=>{cur=k;mkTabs();render();};
    tabsEl.appendChild(b);
  });
}
document.querySelectorAll('#filters .chip').forEach(c=>{
  c.onclick=()=>{
    document.querySelectorAll('#filters .chip').forEach(x=>x.classList.remove('on'));
    c.classList.add('on'); filt=c.dataset.f; render();
  };
});
const dObj = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const monLabel = s => { const [y,m]=s.split('-'); return y+"年"+Number(m)+"月"; };
const esc = s => (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function row(g, isJP){
  const dt = dObj(g.d), past = dt < TODAY;
  const diff = Math.round((dt-TODAY)/86400000);
  const wc = g.w==='土'?' sat':(g.w==='日'?' sun':'');
  const going = GOING.has(gkey(g));
  const cls = 'g'+(past?' past':'')+(!past&&diff<=7?' soon':'')+(isJP?' jp':'')
    +(g.k==='pre'?' pregame':'')+(going?' going':'');
  const [,mm,dd] = g.d.split('-');
  return `<div class="${cls}">
    <div class="dt${wc}"><b>${Number(mm)}/${Number(dd)}</b><i>${g.w}</i></div>
    <div class="mid">
      ${isJP?`<div class="cat">${esc(g.cat)}</div>`:''}
      ${g.k==='pre'?`<div class="pre">プレシーズン${g.ev?' ・ '+esc(g.ev):''}</div>`:''}
      <div class="op">vs ${esc(g.opp)}</div>
      <div class="vn">${esc(isJP ? g.venue : (g.arena? g.pref+' '+g.arena : g.pref))}</div>
      ${isJP&&g.tv?`<div class="tv">📺 ${esc(g.tv)}</div>`:''}
      ${isJP&&g.note?`<div class="nt">${esc(g.note)}</div>`:''}
    </div>
    <div class="rt">
      <span class="ha ${g.ha==='HOME'?'H':(g.ha==='中立'?'N':'A')}">${g.ha==='HOME'?'H':(g.ha==='中立'?'中立':'A')}</span>
      ${g.sc
        ? `<div class="sc ${g.r}">${g.r==='W'?'○':(g.r==='L'?'●':'△')} ${esc(g.sc)}${g.rn?`<small>（${esc(g.rn)}）</small>`:''}</div>`
        : `<div class="tm">${esc(g.t)||'時刻未定'}</div>`}
    </div>
    <button class="go${going?' on':''}" type="button" data-k="${esc(gkey(g))}"
      aria-pressed="${going}" aria-label="行く試合にする">${going?'★':'☆'}</button>
    </div>`;
}

function render(){
  const isJP = cur==="日本代表";
  let games = isJP ? JP.slice() : DATA[cur].games.slice();
  if(filt==='HOME'||filt==='AWAY') games = games.filter(g=>g.ha===filt);
  if(filt==='future') games = games.filter(g=>dObj(g.d)>=TODAY);
  if(filt==='pre') games = games.filter(g=>g.k==='pre');
  if(filt==='going') games = games.filter(g=>GOING.has(gkey(g)));
  document.getElementById('count').textContent = games.length+"試合";

  const upcoming = (isJP?JP:DATA[cur].games).filter(g=>dObj(g.d)>=TODAY)[0];
  let html = '';
  if(upcoming){
    const days = Math.round((dObj(upcoming.d)-TODAY)/86400000);
    const when = days===0?'今日':days===1?'明日':`あと${days}日`;
    html += `<div class="next"><div class="lb">NEXT GAME ・ ${when}</div>
      <div class="mn">${upcoming.d.replace(/-/g,'/')}（${upcoming.w}） ${isJP?'日本代表':DATA[cur].short} vs ${esc(upcoming.opp)}</div>
      <div class="sb">${upcoming.ha==='HOME'?'ホーム':'アウェー'} ・ ${esc(isJP?upcoming.venue:(upcoming.pref+' '+upcoming.arena))} ・ ${esc(upcoming.t)||'時刻未定'}</div></div>`;
  }
  const rec = (list, label) => {
    const done = list.filter(g=>g.sc);
    if(!done.length) return '';
    const w=done.filter(g=>g.r==='W').length, l=done.filter(g=>g.r==='L').length,
          d=done.filter(g=>g.r==='D').length;
    return `<span class="lb">${label}</span> <b>${w}勝${l}敗${d?d+'分':''}</b>`;
  };
  const all = isJP ? JP : DATA[cur].games;
  const parts = isJP
    ? [rec(all,'代表戦')]
    : [rec(all.filter(g=>g.k==='pre'),'プレシーズン'), rec(all.filter(g=>g.k!=='pre'),'リーグ戦')];
  const recHtml = parts.filter(Boolean).join(' &nbsp;/&nbsp; ');
  if(recHtml) html += `<div class="rec">${recHtml}</div>`;

  let lastM='';
  games.forEach(g=>{
    const m=g.d.slice(0,7);
    if(m!==lastM){ html += `<div class="mon">${monLabel(m)}</div>`; lastM=m; }
    html += row(g,isJP);
  });
  html += `<div class="note">
    <b>視聴メモ</b><br>
    ・千葉J（B.PREMIER）・福井（B.ONE）とも全試合 → <b>DAZN</b>（2026-27はB.PREMIER／B.ONE全試合）<br>
    ・日本代表（FIBA主催のW杯予選）→ 地上波＋<b>DAZN・TVer</b>、アウェー戦はABEMAも<br>
    ・アジア競技大会（愛知・名古屋）→ <b>TBS系</b>が国内放送権<br><br>
